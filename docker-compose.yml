#   docker compose up --build
#
# 容器内 127.0.0.1:7890 指向容器自己。宿主机代理请改成：
#   proxy: "http://host.docker.internal:7890"

services:
  grok-rego:
    build: .
    image: grok-rego:latest
    ports:
      - "8787:8787"
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.json:/app/server/config.json
      - grok-rego-db:/app/server/db/data
      - grok-rego-logs:/app/server/logs
    environment:
      GROK_REGO_HOST: "0.0.0.0"
      GROK_REGO_PORT: "8787"
    restart: unless-stopped

volumes:
  grok-rego-db:
  grok-rego-logs:
